[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artex-desktop-extension"
version = "0.4.0"
description = "Local ARTEx MCP connector for Claude Desktop"
requires-python = ">=3.11"
dependencies = ["mcp>=1,<2", "keyring>=25,<27"]

[tool.setuptools.packages.find]
where = ["src"]
